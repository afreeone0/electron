{% extends "base.html" %}

{% block content %}
<h1>Новый пароль</h1>

<form method="post">
    {% csrf_token %}

    <div class="form-error">
        {{form.non_field_errors}}
    </div>

    {% for field in form %}
    <label id="field.id_for_label">{{field.label}}</label>
    {{field}}
    <div class="form-error">{{field.errors}}</div>
    {% endfor %}

    <p><button type="submit">Сохранить</button> </p>
</form>
{% endblock %}
