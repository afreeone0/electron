{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">

    {% if form.errors %}
    {{form.errors}}
    {% endif %}

    <h1 class="text-center">Регистрация</h1>
    <form action="{% url 'registration' %}" method="post">

        {% csrf_token %}

        <div class="form-group">
            <label for="{{ form.first_name.id_for_label }}">Имя</label>
            {{ form.first_name }}
        </div>
        <div class="form-group">
            <label for="{{ form.last_name.id_for_label }}">Фамилия</label>
            {{ form.last_name }}
        </div>
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Логин</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{form.email.id_for_label}}">Адрес электронной почты</label>
            {{ form.email }}
        </div>
        <div class="form-group">
            <label for="{{ form.password1.id_for_label }}">Пароль</label>
            {{ form.password1 }}
        </div>
        <div class="form-group">
            <label for="{{ form.password2.id_for_label }}">Подтвердите пароль</label>
            {{ form.password2 }}
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>

    <p><a href="{% url 'login' %}">Уже есть аккаунт?</a></p>

</div>
{% endblock %}
