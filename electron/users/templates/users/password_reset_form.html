{% extends 'base.html' %}

{% block content %}
<h1>Восстановление пароля</h1>

<form method="post">
    {% csrf_token %}

    {% for field in form %}
    <label id="field.id_for_label">{{field.label}}</label>
    {{field}}
    <div class="form-error">{{field.errors}}</div>
    {% endfor %}

    <p><button type="submit">Сбросить пароль</button> </p>
</form>
{% endblock %}
